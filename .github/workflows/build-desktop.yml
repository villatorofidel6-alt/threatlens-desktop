name: Build desktop artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            extension: .exe
          - os: ubuntu-latest
            name: linux
            extension: ""
          - os: macos-latest
            name: macos
            extension: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -e ".[pe,rules,build]"
      - name: Build native application
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name ThreatLens-${{ matrix.name }}
          --collect-data threatlens.resources
          src/threatlens/desktop_entry.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreatLens-${{ matrix.name }}
          path: dist/ThreatLens-${{ matrix.name }}${{ matrix.extension }}
